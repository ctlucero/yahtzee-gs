# Builds and tests on every push and pull request. Pushing a tag such as
# v1.1 also packages a Linux x86_64 download and attaches it to a GitHub
# release of that name.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The binary runs on distributions with glibc 2.39 or newer and Qt 6.4 or
    # newer: Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch, openSUSE Tumbleweed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="yahtzee-gs-${GITHUB_REF_NAME#v}-linux-x86_64"
          DESTDIR="$PWD/stage" cmake --install build --strip
          mkdir -p "dist/$name"
          cp -r stage/usr/bin stage/usr/share "dist/$name/"
          cp packaging/install.sh LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Yahtzee $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
