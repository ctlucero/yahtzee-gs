# Flatpak manifest. Build and install from the project root with:
#   flatpak-builder --user --install --force-clean build-dir packaging/io.github.yahtzee_gs.Yahtzee.yml
app-id: io.github.yahtzee_gs.Yahtzee
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: yahtzee-gs
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: yahtzee-gs
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
        skip:
          - build-dir
          - .flatpak-builder
